spring:
  application:
    name: les-restaurateurs-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurateurs}
    username: ${DB_USER:resto}
    password: ${DB_PASSWORD:resto}

  jpa:
    hibernate:
      # Le schéma est géré par Flyway, jamais par Hibernate.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  # 8081 par défaut : le port 8080 est souvent déjà pris en local.
  port: ${PORT:8081}
  forward-headers-strategy: framework

app:
  # URL publique du front, utilisée pour construire le lien magique.
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:les-restaurateurs@localhost}
  magic-link-ttl-minutes: 15
  session-ttl-days: 30
  # En dev, le lien magique est aussi écrit dans les logs pour dépanner.
  log-magic-link: ${LOG_MAGIC_LINK:true}
  # Cookie de session en Secure : à activer en production (HTTPS).
  cookie-secure: ${COOKIE_SECURE:false}

logging:
  level:
    fr.lesrestaurateurs: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
