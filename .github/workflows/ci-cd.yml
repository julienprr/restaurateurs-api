name: CI/CD API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: julienprr/restaurateurs-api

jobs:
  # Les tests tournent aussi sur les pull requests, et bloquent la suite.
  # Sans cette étape, une image cassée partirait en production sans un mot.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Tests
        run: mvn -B test

  build-and-push:
    needs: test
    # Une pull request est vérifiée, mais rien n'est publié ni déployé.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Le cache accélère nettement les builds suivants : Maven ne
          # retélécharge pas toutes ses dépendances à chaque fois.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/setup-kubectl@v4

      - name: Configurer kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Déployer
        run: |
          kubectl -n prod set image deployment/restaurateurs-api \
            api=${{ env.IMAGE }}:${{ github.sha }}

      # Sans cette étape, le workflow serait vert même si le pod refusait de
      # démarrer. La stratégie Recreate implique une courte coupure, le temps
      # que Flyway applique d'éventuelles migrations.
      - name: Vérifier le déploiement
        run: kubectl -n prod rollout status deployment/restaurateurs-api --timeout=300s

      - name: État final
        if: always()
        run: kubectl -n prod get pods -l app=restaurateurs-api
